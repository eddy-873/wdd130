<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Edward water Rafting Company</title>
    <meta name="description"
      content="Contact Edward water Rafting company for reservations, general inquiries, or website suggestions.">
    <meta name="author" content="Edward Kamara">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-blue.jpg" alt="Whitewater Rafting Adventures Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>

    </header>

    <main class="contact page">
        <section class="company-contact">

            <address>
                <strong>
                    Edward White water rafting company
                </strong><br>
                <strong>83 City Road Wellington</strong><br>
                <strong>Eastern, Haja Fatmata.</strong><br>
                <strong>+23288596695</strong><br>
                <strong>kamarae873@gmail.com</strong>
            </address>
        </section>

        <section class="contact-layout">
            <div class="contact-map">
                <iframe title="Map of the Company location"
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d98095.50460366571!2d-13.290534538164007!3d8.488686651685045!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2ssl!4v1764573687105!5m2!1sen!2ssl"
                  width="600" height="450" loading="lazy" allowfullscreen=""
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
            <div class="contact-form">
                <form action="#" method="post">
                    <div>
                        <label for="Name">Name</label>
                        <input type="text" id="Name" name="Name" placeholder="placeholder">
                    </div>
                    <br>

                    <div>
                        <label for="Email">Email</label>
                        <input type="text" id="Email" name="Email" placeholder="placeholder">
                    </div>
                    <fieldset class="purpose-row">
                        <legend>Message<br>Purpose</legend>
                        <div class="purpose-options">
                            <label for="general">
                                <input type="radio" id="general" name="purpose" value="general"
                                  required>
                                General Inquiry
                            </label>
                            <br>
                            <label for="reservation">
                                <input type="radio" id="reservation" name="purpose"
                                  value="reservation">
                                Reservation Question
                            </label>
                            <br>

                            <label for="suggestion">
                                <input type="radio" id="suggestion" name="purpose"
                                  value="suggestion">
                                Website Suggestion
                            </label>
                        </div>

                    </fieldset>
                    <br>
                    <div class="message-row">
                        <label for="message">Message</label><br>
                        <textarea id="message" name="message" placeholder="Type-here" required>
                        </textarea>
                    </div>
                    <br>
                    <div>
                        <input type="checkbox" id="newsletter" name="newsletter">

                        <label for="newsletter">Please Subscribe me to the monthly
                            newsletter</label>
                    </div>
                    <button type="submit">Get in touch!</button>

                </form>
            </div>

        </section>

        <section class="employee-section">
            <h2>We are here to serve You</h2>
            <div class="employee-profiles">
                <figure>
                    <img src="images/profile1.jpg" alt="second employee">
                    <figcaption>Employee profile</figcaption>
                </figure>
                <figure>
                    <img src="images/profile2.jpg" alt="Third employee">
                    <figcaption>Employee profile</figcaption>
                </figure>
                <figure>
                    <img src="images/profile3.jpg" alt="First employee">
                    <figcaption>Employee profile</figcaption>
                </figure>


            </div>

        </section>


    </main>

    <footer>
        <p>© 2025 Edward water Rafting company | Designed by Edward Kamara</p>

        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.jpg"
                  alt="Follow us on Facebook" width="50"></a>
            <a href="https://instagram.com"><img src="images/instagram.jpg"
                  alt="Follow us on Instagram" width="50"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.jpg"
                  alt="Follow us on LinkedIn" width="50"></a>
        </nav>
    </footer>

</body>

</html>
