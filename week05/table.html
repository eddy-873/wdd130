<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/table.css">
    <title>Tables</title>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>Leagues</th>
                <th>Team </th>
                <th>Records</th>
                <th>Player Count </th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="2">Southern</th>
                <td>parana</td>
                <td>50-19</td>
                <td>23</td>
            </tr>
            <tr>
                <td>caterina</td>
                <td>49-24</td>
                <td>10</td>
            </tr>
        </tbody>
        <tbody>
            <tr>
                <th rowspan="3">Western</th>
                <td>Laceerda</td>
                <td>92-70</td>
                <td>27</td>
            </tr>
            <tr>
                <td>Acre</td>
                <td>75-87</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Rondonia</td>
                <td>10-7</td>
                <td>12</td>
            </tr>


        </tbody>
        <tfoot>
            <tr>
                <th colspan="3">Total Players</th>
                <td>92</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
